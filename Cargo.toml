[package]
name = "r-helper"
version = "0.6.0"
edition = "2021"
description = "CPUnity:R-Helper - Razer Blade control interface (fork of R-Helper)"
authors = ["Fatalution", "CPUnity"]

[[bin]]
name = "CR-Helper"
path = "src/main.rs"

[dependencies]
eframe = "0.32.2"
anyhow = "1.0.89"
librazer = { path = "./librazer" }
image = "0.25.8"
ab_glyph = "0.2"
strum = { version = "0.26.1", features = ["derive"] }
# Game 3's sound: mp3 songs from inside the program, and effects made in synth.rs
rodio = { version = "0.20", default-features = false, features = ["symphonia-mp3"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.0", features = [
    "Win32_System_Power",
    "Win32_UI_Shell"
] }

[build-dependencies]
embed-resource = "3.0.5"

[workspace]
resolver = "2"
members = [
    ".",          # r-helper (GUI)
    "librazer",   # shared lib
]
default-members = [
    ".",          # build only the GUI by default (root crate)
]
